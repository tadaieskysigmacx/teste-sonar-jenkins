# Testes + analise no SonarQube Community (plugin de branches/PR) + Quality Gate.
# Segredos do repositorio: SONAR_TOKEN e SONAR_HOST_URL.
# Para bloquear o merge, marque o check "sonar" como obrigatorio na branch protection.
name: sonar

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PRs de forks nao recebem segredos
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historico completo: blame e "codigo novo"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Testes com cobertura
        run: |
          python -m pip install -q -r requirements-dev.txt
          pytest --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml

      # Plugin de branches: PR -> sonar.pullrequest.*, branch principal -> nada, outras -> sonar.branch.name
      - name: Escopo da analise
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_KEY: ${{ github.event.number }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "args=-Dsonar.pullrequest.key=$PR_KEY -Dsonar.pullrequest.branch=$PR_HEAD -Dsonar.pullrequest.base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=-Dsonar.branch.name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Analise SonarQube
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: ${{ steps.scope.outputs.args }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
